apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: petclinic
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: petclinic
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
