apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: petclinic
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: petclinic
    spec:
      containers:
        - name: frontend
          image: flavioh/spring-petclinic-ui:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: petclinic-config
