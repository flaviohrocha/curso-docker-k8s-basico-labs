apiVersion: v1
kind: Pod
metadata:
  name: k8s-in-action
  labels:
    app: k8s-in-action
spec:
  containers:
    - name: app
      image: flavioh/k8s-in-action:latest
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 3000
          protocol: TCP
      env:
        - name: NODE_ENV
          value: production
        - name: MENSAGEM_DESTAQUE
          value: "Olá Kubernetes"
