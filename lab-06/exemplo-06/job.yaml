apiVersion: batch/v1
kind: Job

metadata:
  name: processamento
  namespace: exemplo-06

spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: processamento
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Processando..."
              sleep 10
              echo "Processamento concluído"