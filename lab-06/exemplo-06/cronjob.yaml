apiVersion: batch/v1
kind: CronJob
metadata:
  name: every-minute-job
  namespace: exemplo-06
spec:
  schedule: "* * * * *"  # This schedule runs at every minute
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            args:
            - /bin/sh
            - -c
            - date; echo Hello from the Kubernetes cluster
          restartPolicy: OnFailure