apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
  namespace: nodejs-health
  labels:
    app.kubernetes.io/name: health-api
    app.kubernetes.io/part-of: nodejs-kubernetes-health
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: health-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-api
        app.kubernetes.io/part-of: nodejs-kubernetes-health
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: health-api
          image: flavioh/nodejs-kubernetes-health:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nodejs-health-config
                  key: PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: nodejs-health-config
                  key: REDIS_URL
            - name: PAYMENT_API_HEALTH_URL
              valueFrom:
                configMapKeyRef:
                  name: nodejs-health-config
                  key: PAYMENT_API_HEALTH_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nodejs-health-secret
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 2"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
