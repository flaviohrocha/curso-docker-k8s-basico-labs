apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nodejs-health
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nodejs-kubernetes-health
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
