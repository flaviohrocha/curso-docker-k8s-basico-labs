apiVersion: v1
kind: PersistentVolume
metadata:
  name: nodejs-health-redis-pv
  labels:
    app.kubernetes.io/part-of: nodejs-kubernetes-health
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/kubernetes/nodejs-health/redis
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lab-worker2
