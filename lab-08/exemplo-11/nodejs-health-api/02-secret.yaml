apiVersion: v1
kind: Secret
metadata:
  name: nodejs-health-secret
  namespace: nodejs-health
  labels:
    app.kubernetes.io/part-of: nodejs-kubernetes-health
type: Opaque
stringData:
  POSTGRES_DB: "health"
  POSTGRES_USER: "healthapp"
  POSTGRES_PASSWORD: "change-me-local"
  DATABASE_URL: "postgres://healthapp:change-me-local@postgres:5432/health"
