apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nodejs-health
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: nodejs-kubernetes-health
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
