apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: nodejs-health
  labels:
    app.kubernetes.io/part-of: nodejs-kubernetes-health
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: nodejs-health-postgres-pv
  resources:
    requests:
      storage: 2Gi
