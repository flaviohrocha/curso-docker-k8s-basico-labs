apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-in-action-ing
  namespace: exemplo-09
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-in-action.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-in-action-app
                port:
                  number: 3000
