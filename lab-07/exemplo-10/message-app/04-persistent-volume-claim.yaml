apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-mariadb-pvc
  namespace: message-app
  labels:
    app.kubernetes.io/part-of: message-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
  volumeName: message-mariadb-pv
