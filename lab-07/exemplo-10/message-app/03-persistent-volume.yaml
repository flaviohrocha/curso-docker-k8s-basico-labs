apiVersion: v1
kind: PersistentVolume
metadata:
  name: message-mariadb-pv
  labels:
    app.kubernetes.io/part-of: message-app
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/kubernetes/message-app/mariadb
    type: DirectoryOrCreate
