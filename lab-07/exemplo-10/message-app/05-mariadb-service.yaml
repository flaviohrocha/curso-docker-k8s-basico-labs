apiVersion: v1
kind: Service
metadata:
  name: message-mariadb
  namespace: message-app
  labels:
    app.kubernetes.io/name: message-mariadb
    app.kubernetes.io/part-of: message-app
spec:
  # Serviço headless para fornecer DNS estável ao StatefulSet.
  clusterIP: None
  selector:
    app.kubernetes.io/name: message-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
