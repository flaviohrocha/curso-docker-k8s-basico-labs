apiVersion: v1
kind: Service
metadata:
  name: message-server
  namespace: message-app
  labels:
    app.kubernetes.io/name: message-server
    app.kubernetes.io/part-of: message-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: message-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
